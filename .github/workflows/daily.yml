name: Daily literature brief

on:
  schedule:
    # 00:37 UTC is 08:37 in China Standard Time. Avoid the top of the hour.
    - cron: "37 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-literature-brief
  cancel-in-progress: false

jobs:
  build-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate brief
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: python src/main.py

      - name: Commit new brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs data/seen_papers.json
          if git diff --cached --quiet; then
            echo "No new brief changes to commit."
          else
            git commit -m "docs: add daily literature brief"
            git push
          fi
